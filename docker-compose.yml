services:
  web:
    build: .
    container_name: web
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput && python manage.py makemigrations && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:${BACKEND_PORT} --workers 4 --forwarded-allow-ips='*'"
    volumes:
      - .:/app
    ports:
      - ${BACKEND_PORT}:8000
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432

volumes:
  postgres_data:
