components:
  schemas:
    AddOnsPrice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service:
          type: string
          maxLength: 255
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - id
      - service
    BookingDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          $ref: '#/components/schemas/PropertyList'
        owner:
          $ref: '#/components/schemas/UserData'
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 100
        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/Status836Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - check_in
      - check_out
      - created_at
      - email
      - guest_count
      - id
      - name
      - owner
      - phone
      - price
      - property
      - updated_at
    BookingList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          $ref: '#/components/schemas/PropertyList'
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 100
        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/Status836Enum'
      required:
      - check_in
      - check_out
      - email
      - guest_count
      - id
      - name
      - phone
      - price
      - property
    CreateBooking:
      type: object
      properties:
        property:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 100
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - check_in
      - check_out
      - email
      - guest_count
      - name
      - phone
      - property
    CreateUser:
      type: object
      properties:
        email:
          type: string
          format: email
          title: User Email
          maxLength: 255
        password:
          type: string
          writeOnly: true
          maxLength: 128
        phone:
          type: string
          nullable: true
          title: Phone Number
          maxLength: 20
        name:
          type: string
          nullable: true
          title: User Name
          maxLength: 200
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: User Role
      required:
